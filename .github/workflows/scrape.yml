name: OLX Playwright worker

on:
  push:
    branches:
      - master
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: agrimarket-playwright-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: https://teterxteofyhmrcijrew.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      WORKER_NAME: agrimarket-playwright-v3-github-actions
      RUN_ONCE: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run one scrape cycle
        run: npm start
